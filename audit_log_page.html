<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>操作紀錄 — 院內公告系統</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=noto-sans-tc:300,400,500,700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --primary: #4a4e52;
            --primary-mid: #6c757d;
            --radius: 10px;
            --gray-400: #adb5bd;
            --gray-500: #6c757d;
            --gray-600: #495057;
            --gray-700: #343a40;
            --gray-800: #212529;
            --teal: #4a7260;
            --red: #b85c4a;
            --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", Arial, sans-serif;
            background: #f4f5f7;
            color: #333a40;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed; inset: 0; z-index: -2;
            background:
                radial-gradient(circle at 10% 15%, rgba(255,255,255,1) 0%, transparent 50%),
                radial-gradient(ellipse 60% 55% at 90% 80%, rgba(200,205,215,0.4) 0%, transparent 60%),
                linear-gradient(150deg, #ffffff 0%, #eceef1 40%, #dee2e6 100%);
        }

        /* TOP BAR */
        .top-bar {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.9);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 16px rgba(140,100,60,0.08);
        }
        .top-bar-inner {
            max-width: 1200px; margin: 0 auto;
            padding: 0 24px; height: 60px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 36px; height: 36px; background: rgba(122,92,58,0.1); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 16px; }
        .brand-name { font-size: 1rem; font-weight: 700; color: var(--primary); }
        .brand-sub { font-size: 0.7rem; color: rgba(122,92,58,0.5); letter-spacing: 0.06em; }

        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 8px 18px; border: none; border-radius: 7px;
            font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit; text-decoration: none;
        }
        .btn-secondary {
            background: rgba(122,92,58,0.08); color: var(--gray-600);
            border: 1px solid rgba(122,92,58,0.18);
        }
        .btn-secondary:hover { background: rgba(122,92,58,0.15); }
        .btn-primary { background: var(--primary); color: #fff8ee; }
        .btn-primary:hover { background: var(--primary-mid); }
        .btn-excel {
            background: rgba(33,115,70,0.1); color: #1a6b40;
            border: 1px solid rgba(33,115,70,0.22);
        }
        .btn-excel:hover { background: #217346; color: white; }

        /* MAIN */
        .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        /* CARD */
        .card {
            background: rgba(255,255,255,0.72);
            backdrop-filter: blur(16px) saturate(120%);
            border: 1px solid rgba(255,255,255,0.82);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            margin-bottom: 20px; overflow: hidden;
        }
        .card-header {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(122,92,58,0.08);
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(255,248,238,0.3);
        }
        .card-title {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.95rem; font-weight: 700; color: var(--primary);
        }
        .card-title-icon {
            width: 30px; height: 30px;
            background: rgba(122,92,58,0.1); border: 1px solid rgba(122,92,58,0.18);
            border-radius: 7px; display: flex; align-items: center; justify-content: center;
            color: var(--primary-mid); font-size: 13px;
        }
        .card-body { padding: 20px 22px; }

        /* STATS ROW */
        .stats-row {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: rgba(255,248,238,0.65); border: 1px solid rgba(255,255,255,0.8);
            border-radius: var(--radius); padding: 16px 18px;
            box-shadow: 0 4px 16px rgba(140,100,60,0.08);
            display: flex; align-items: center; gap: 12px;
        }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0;
        }
        .stat-icon.blue   { background: rgba(74,78,82,0.1);    color: #4a4e52; }
        .stat-icon.green  { background: rgba(60,160,80,0.1);   color: #2a7a40; }
        .stat-icon.red    { background: rgba(184,92,74,0.12);  color: #a0422e; }
        .stat-icon.orange { background: rgba(196,120,64,0.12); color: #9a5c25; }
        .stat-num { font-size: 1.5rem; font-weight: 700; color: var(--primary); line-height: 1; }
        .stat-label { font-size: 0.73rem; color: var(--gray-400); margin-top: 3px; font-weight: 500; }

        /* FILTER TOOLBAR */
        .filter-bar {
            display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
            padding: 14px 22px; background: rgba(255,248,238,0.25);
            border-bottom: 1px solid rgba(122,92,58,0.07);
        }
        .filter-bar label {
            font-size: 0.8rem; font-weight: 600; color: var(--gray-600); white-space: nowrap;
        }
        .filter-bar select, .filter-bar input[type="date"], .filter-bar input[type="text"] {
            font-size: 0.82rem; padding: 6px 10px;
            border: 1px solid rgba(122,92,58,0.2); border-radius: 7px;
            background: rgba(255,248,238,0.8); color: var(--gray-700);
            height: 34px; font-family: inherit;
        }
        .filter-bar input[type="text"] { width: 200px; }
        .filter-divider { width: 1px; height: 22px; background: rgba(122,92,58,0.15); margin: 0 4px; }
        .filter-count {
            margin-left: auto; font-size: 0.82rem; color: var(--gray-500); white-space: nowrap;
        }

        /* TABLE */
        .table-wrap { overflow-x: auto; }
        .audit-table {
            width: 100%; border-collapse: collapse;
            font-size: 0.84rem; background: transparent;
        }
        .audit-table th {
            background: rgba(122,92,58,0.06); color: var(--gray-600);
            font-weight: 700; padding: 10px 14px; text-align: left;
            border-bottom: 1px solid rgba(122,92,58,0.12); white-space: nowrap;
            font-size: 0.75rem; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .audit-table td {
            padding: 10px 14px; border-bottom: 1px solid rgba(122,92,58,0.07);
            color: var(--gray-700); vertical-align: middle;
        }
        .audit-table tr:last-child td { border-bottom: none; }
        .audit-table tr:hover td { background: rgba(122,92,58,0.03); }

        .audit-badge {
            display: inline-block; font-size: 0.74rem;
            padding: 3px 10px; border-radius: 20px; font-weight: 600;
        }
        .audit-badge.login  { background: rgba(60,160,80,0.12);   color: #2a7a40; }
        .audit-badge.logout { background: rgba(120,120,120,0.12);  color: #555; }
        .audit-badge.add    { background: rgba(70,120,200,0.12);   color: #2a5ba0; }
        .audit-badge.edit   { background: rgba(200,140,30,0.13);   color: #7a5000; }
        .audit-badge.delete { background: rgba(200,60,60,0.12);    color: #a02020; }
        .audit-badge.star   { background: rgba(200,160,0,0.13);    color: #806000; }
        .audit-badge.pin    { background: rgba(106,143,122,0.14);  color: #3a6650; }
        .audit-empty {
            text-align: center; padding: 48px 20px; color: var(--gray-400); font-size: 0.9rem;
        }
        .audit-empty i { font-size: 2rem; display: block; margin-bottom: 10px; color: rgba(122,92,58,0.18); }

        /* PAGINATION */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 6px; padding: 16px;
        }
        .page-btn {
            min-width: 34px; height: 34px; border-radius: 7px;
            border: 1px solid rgba(122,92,58,0.2);
            background: rgba(255,248,238,0.6); color: var(--gray-600);
            font-size: 0.83rem; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            padding: 0 10px; font-family: inherit; transition: all 0.15s;
        }
        .page-btn:hover { background: rgba(122,92,58,0.1); color: var(--primary); }
        .page-btn.active { background: var(--primary); color: #fff8ee; border-color: var(--primary); }
        .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .page-info { font-size: 0.82rem; color: var(--gray-500); padding: 0 6px; }

        /* AUTH OVERLAY */
        #auth_overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(100,70,40,0.25); z-index: 500;
            backdrop-filter: blur(10px); align-items: center; justify-content: center;
        }
        #auth_overlay.show { display: flex; }
        .auth-box {
            background: rgba(255,248,238,0.9); border: 1px solid rgba(255,255,255,0.9);
            border-radius: 14px; padding: 36px 40px; text-align: center;
            box-shadow: 0 20px 60px rgba(140,100,60,0.18); max-width: 340px; width: 90%;
        }
        .auth-box i { font-size: 2.5rem; color: rgba(122,92,58,0.5); margin-bottom: 14px; display: block; }
        .auth-box h2 { font-size: 1rem; color: var(--primary); margin-bottom: 8px; }
        .auth-box p { font-size: 0.85rem; color: var(--gray-500); margin-bottom: 20px; }

        /* TOAST */
        .toast-container { position: fixed; top: 76px; right: 20px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; }
        .toast {
            background: rgba(255,248,238,0.9); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.88); border-radius: 8px;
            padding: 12px 18px; box-shadow: 0 8px 28px rgba(140,100,60,0.14);
            display: flex; align-items: center; gap: 10px;
            font-size: 0.88rem; font-weight: 500; color: var(--gray-800);
            min-width: 240px; animation: toastIn 0.3s ease; border-left: 3px solid var(--teal);
        }
        .toast.error { border-left-color: var(--red); }
        @keyframes toastIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:none; } }

        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .filter-bar { flex-wrap: wrap; }
            .filter-bar input[type="text"] { width: 140px; }
            .top-bar-inner { padding: 0 14px; }
            .main { padding: 16px 14px; }
        }

        /* 申請單位下拉搜尋 */
        .unit-search-wrap {
            position: relative; display: inline-block;
        }
        .unit-search-wrap input {
            width: 160px;
        }
        #f_unit_dropdown {
            display: none;
            position: absolute; top: calc(100% + 4px); left: 0;
            width: 280px; max-height: 240px; overflow-y: auto;
            background: rgba(255,248,238,0.97);
            border: 1px solid rgba(122,92,58,0.2);
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(140,100,60,0.14);
            z-index: 500;
        }
        #f_unit_dropdown .u-opt {
            padding: 7px 13px; cursor: pointer;
            font-size: 0.82rem; color: #444;
            border-bottom: 1px solid rgba(122,92,58,0.06);
        }
        #f_unit_dropdown .u-opt:hover { background: rgba(122,92,58,0.07); }
        #f_unit_dropdown .u-opt .u-code { color: #8a6a40; font-weight: 600; margin-right: 5px; }
        #f_unit_dropdown .u-empty { padding: 10px 14px; color: #aaa; font-size: 0.82rem; }

        /* 刪除按鈕 */
        .btn-row-delete {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px; border-radius: 6px; font-size: 0.76rem;
            font-weight: 600; cursor: pointer; border: none;
            background: rgba(184,92,74,0.1); color: #a0422e;
            border: 1px solid rgba(184,92,74,0.22);
            font-family: inherit; transition: all 0.18s;
            white-space: nowrap;
        }
        .btn-row-delete:hover {
            background: rgba(184,92,74,0.18);
            box-shadow: 0 2px 8px rgba(184,92,74,0.15);
            transform: translateY(-1px);
        }

        /* 確認 Modal */
        #confirm_modal {
            display: none; position: fixed; inset: 0; z-index: 2000;
            background: rgba(60,40,20,0.35); backdrop-filter: blur(8px);
            align-items: center; justify-content: center;
        }
        #confirm_modal.show { display: flex; }
        .confirm-box {
            background: rgba(255,248,238,0.97);
            border: 1px solid rgba(255,255,255,0.9);
            border-radius: 14px; padding: 32px 36px;
            text-align: center; max-width: 380px; width: 90%;
            box-shadow: 0 20px 60px rgba(140,100,60,0.2);
            animation: toastIn 0.2s ease;
        }
        .confirm-box .ci { font-size: 2.2rem; color: #c06040; margin-bottom: 12px; }
        .confirm-box h3 { font-size: 1rem; color: var(--primary); margin-bottom: 8px; }
        .confirm-box p {
            font-size: 0.84rem; color: var(--gray-500);
            line-height: 1.6; margin-bottom: 20px;
        }
        .confirm-box p strong { color: var(--gray-700); }
        .confirm-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-confirm-del {
            padding: 9px 22px; border-radius: 7px; font-size: 0.85rem; font-weight: 700;
            cursor: pointer; border: none; font-family: inherit;
            background: #b85c4a; color: #fff; transition: background 0.2s;
        }
        .btn-confirm-del:hover { background: #a04030; }
        .btn-confirm-cancel {
            padding: 9px 22px; border-radius: 7px; font-size: 0.85rem; font-weight: 600;
            cursor: pointer; font-family: inherit;
            background: rgba(122,92,58,0.08); color: var(--gray-600);
            border: 1px solid rgba(122,92,58,0.18); transition: background 0.2s;
        }
        .btn-confirm-cancel:hover { background: rgba(122,92,58,0.15); }
    </style>
</head>
<body>

<div class="toast-container" id="toast_container"></div>

<!-- 刪除確認 Modal -->
<div id="confirm_modal">
    <div class="confirm-box">
        <div class="ci"><i class="fas fa-exclamation-triangle"></i></div>
        <h3>確認刪除此筆紀錄？</h3>
        <p id="confirm_desc">此操作無法還原，刪除後統計數字將同步更新。</p>
        <div class="confirm-actions">
            <button class="btn-confirm-cancel" onclick="closeConfirm()">取消</button>
            <button class="btn-confirm-del" id="confirm_ok_btn" onclick="executeDelete()">
                <i class="fas fa-trash-alt"></i> 確認刪除
            </button>
        </div>
    </div>
</div>

<!-- AUTH OVERLAY -->
<div id="auth_overlay">
    <div class="auth-box">
        <i class="fas fa-lock"></i>
        <h2>需要管理員權限</h2>
        <p>此頁面僅限管理員查看，請先在主系統登入後再開啟此頁面。</p>
        <a href="index.html" class="btn btn-primary" style="justify-content:center;width:100%;">
            <i class="fas fa-arrow-left"></i> 返回主系統登入
        </a>
    </div>
</div>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="top-bar-inner">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-history"></i></div>
            <div>
                <div class="brand-name">操作紀錄</div>
                <div class="brand-sub">AUDIT LOG</div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
            <span id="header_date" style="font-size:0.8rem;color:rgba(90,58,30,0.5);"></span>
            <button class="btn btn-excel" onclick="exportExcel()" id="btn_export">
                <i class="fas fa-file-excel"></i> 匯出 Excel
            </button>
            <button class="btn btn-secondary" onclick="loadLogs()">
                <i class="fas fa-sync-alt"></i> 重新整理
            </button>
            <a href="index.html" class="btn btn-secondary">
                <i class="fas fa-arrow-left"></i> 返回主系統
            </a>
        </div>
    </div>
</header>

<div class="main">

    <!-- STATS ROW -->
    <div class="stats-row" id="stats_row">
        <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-list-alt"></i></div>
            <div><div class="stat-num" id="s_total">—</div><div class="stat-label">總紀錄筆數</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon green"><i class="fas fa-sign-in-alt"></i></div>
            <div><div class="stat-num" id="s_login">—</div><div class="stat-label">登入次數</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-plus-circle"></i></div>
            <div><div class="stat-num" id="s_add">—</div><div class="stat-label">新增／覆蓋公告</div></div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red"><i class="fas fa-trash-alt"></i></div>
            <div><div class="stat-num" id="s_delete">—</div><div class="stat-label">刪除公告</div></div>
        </div>
    </div>

    <!-- MAIN CARD -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <div class="card-title-icon"><i class="fas fa-table"></i></div>
                完整操作紀錄
            </div>
            <span id="logged_as" style="font-size:0.8rem;color:var(--gray-400);"></span>
        </div>

        <!-- FILTER BAR -->
        <div class="filter-bar">
            <label><i class="fas fa-search" style="margin-right:4px;opacity:0.6;"></i>關鍵字</label>
            <input type="text" id="f_keyword" placeholder="搜尋標題或說明..." oninput="applyFilter()">

            <div class="filter-divider"></div>

            <label>人員</label>
            <select id="f_operator" onchange="applyFilter()">
                <option value="">全部人員</option>
            </select>

            <label>動作</label>
            <select id="f_action" onchange="applyFilter()">
                <option value="">全部動作</option>
                <option>登入</option><option>登出</option>
                <option value="__publish__">新增／覆蓋公告</option>
                <option>編輯公告</option><option>刪除公告</option>
                <option>加入焦點輪播</option><option>移除焦點輪播</option>
                <option>跨月釘選</option><option>取消跨月釘選</option>
            </select>

            <label>公告大項</label>
            <select id="f_category" onchange="applyFilter()">
                <option value="">全部大項</option>
                <option>一般公告</option>
                <option>全院宣導</option>
                <option>人資公告</option>
                <option>JIT</option>
            </select>

            <label>月份</label>
            <input type="month" id="f_date" onchange="applyFilter()" title="篩選月份">

            <label>申請單位</label>
            <div class="unit-search-wrap">
                <input type="text" id="f_unit" placeholder="輸入代號或名稱..." autocomplete="off"
                    oninput="filterUnitDropdown()" onfocus="showUnitFilterDropdown()" onblur="hideUnitFilterDropdown()"
                    style="width:160px;">
                <div id="f_unit_dropdown"></div>
            </div>

            <button class="btn btn-secondary" style="padding:5px 12px;font-size:0.8rem;" onclick="clearFilter()">
                <i class="fas fa-times"></i> 清除篩選
            </button>

            <span class="filter-count" id="filter_count"></span>
        </div>

        <!-- TABLE -->
        <div class="table-wrap">
            <table class="audit-table" id="audit_table">
                <thead>
                    <tr>
                        <th>時間</th>
                        <th>操作人員</th>
                        <th>動作</th>
                        <th>申請單位</th>
                        <th>說明</th>
                        <th>公告大項</th>
                        <th style="text-align:center;">操作</th>
                    </tr>
                </thead>
                <tbody id="audit_tbody">
                    <tr><td colspan="6" class="audit-empty">
                        <i class="fas fa-spinner fa-spin"></i><br>載入中...
                    </td></tr>
                </tbody>
            </table>
        </div>

        <!-- PAGINATION -->
        <div class="pagination" id="pagination"></div>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PAGE_SIZE = 30;
let allLogs     = [];
let filtered    = [];
let currentPage = 1;

// ── INIT ──
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('header_date').textContent =
        new Date().toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' });

    checkAuth();
});

function checkAuth() {
    fetch('api/check_auth.php')
    .then(r => r.json())
    .then(data => {
        if (!data.loggedIn) {
            document.getElementById('auth_overlay').classList.add('show');
        } else {
            if (data.adminName) {
                document.getElementById('logged_as').textContent = `登入者：${data.adminName}`;
            }
            loadLogs();
        }
    })
    .catch(() => {
        document.getElementById('auth_overlay').classList.add('show');
    });
}

function loadLogs() {
    document.getElementById('audit_tbody').innerHTML =
        '<tr><td colspan="7" class="audit-empty"><i class="fas fa-spinner fa-spin"></i><br>載入中...</td></tr>';

    fetch('api/audit_log.php?limit=500')
    .then(r => r.json())
    .then(res => {
        if (!res.success) throw new Error('API 回傳失敗');
        allLogs = res.logs;
        buildOperatorOptions();
        updateStats();
        applyFilter();
    })
    .catch(() => {
        document.getElementById('audit_tbody').innerHTML =
            '<tr><td colspan="7" class="audit-empty"><i class="fas fa-exclamation-circle"></i><br>載入失敗，請重新整理</td></tr>';
    });
}

function buildOperatorOptions() {
    const sel  = document.getElementById('f_operator');
    const cur  = sel.value;

    // ★ 白名單：與 config.php 的 ADMIN_ACCOUNTS 保持一致
    //   日後新增/刪除帳號時，同步更新這裡即可
    const VALID_OPERATORS = ['視聽中心', '教學部', '主任'];

    const ops = [...new Set(allLogs.map(l => l.operator))]
        .filter(op => VALID_OPERATORS.includes(op));   // 過濾舊帳號與「未知」

    sel.innerHTML = '<option value="">全部人員</option>';
    ops.forEach(op => {
        const o = document.createElement('option');
        o.value = op; o.textContent = op;
        if (op === cur) o.selected = true;
        sel.appendChild(o);
    });
}

function updateStats() {
    document.getElementById('s_total').textContent  = allLogs.length;
    document.getElementById('s_login').textContent  = allLogs.filter(l => l.action === '登入').length;
    document.getElementById('s_add').textContent    = allLogs.filter(l => l.action === '新增公告' || l.action === '覆蓋公告').length;
    document.getElementById('s_delete').textContent = allLogs.filter(l => l.action === '刪除公告').length;
}

// ── PARSE DETAIL / UNIT / CATEGORY ──
function parseAuditDetail(raw) {
    const s = raw || '';

    // 新格式：標題【類別：xxx】【申請：xxx】
    const mUnit = s.match(/【申請：(.+?)】/);
    const mCat  = s.match(/【類別：(.+?)】/);

    if (mCat) {
        // 新格式：類別從標記取得
        return {
            detail:   s.replace(/【申請：.+?】/g, '').replace(/【類別：.+?】/g, '').trim() || '',
            unit:     mUnit ? mUnit[1] : '',
            category: mCat[1],
        };
    }

    // 舊格式：「全院宣導｜標題」或「人資公告｜標題【申請：xxx】」
    const CATEGORIES = ['一般公告', '全院宣導', '人資公告', 'JIT'];
    const pipeIdx = s.indexOf('｜');
    if (pipeIdx !== -1) {
        const prefix = s.slice(0, pipeIdx).trim();
        if (CATEGORIES.includes(prefix)) {
            const rest = s.slice(pipeIdx + 1).replace(/【申請：.+?】/g, '').trim();
            return {
                detail:   rest || '',
                unit:     mUnit ? mUnit[1] : '',
                category: prefix,
            };
        }
    }

    // 無法識別：整段當 detail
    return {
        detail:   s.replace(/【申請：.+?】/g, '').trim() || '',
        unit:     mUnit ? mUnit[1] : '',
        category: '',
    };
}

// ── FILTER ──
function applyFilter() {
    const kw     = document.getElementById('f_keyword').value.trim().toLowerCase();
    const op     = document.getElementById('f_operator').value;
    const action = document.getElementById('f_action').value;
    const month  = document.getElementById('f_date').value;       // "YYYY-MM"
    const unitKw = document.getElementById('f_unit').value.trim().toLowerCase();
    const catKw  = document.getElementById('f_category').value;   // 精確比對

    filtered = allLogs.filter(log => {
        if (op) { if (log.operator !== op) return false; }
        if (action === '__publish__') {
            if (log.action !== '新增公告' && log.action !== '覆蓋公告') return false;
        } else if (action) {
            if (log.action !== action) return false;
        }
        if (month  && !log.time.startsWith(month))      return false;
        const { detail, unit, category } = parseAuditDetail(log.detail);
        if (unitKw) {
            // 直接比對名稱
            const nameMatch = unit.toLowerCase().includes(unitKw);
            // 也支援輸入代號反查（4220 → 視聽中心）
            const codeMatch = !nameMatch && (() => {
                const found = AUDIT_UNIT_LIST.find(u => u.s.startsWith(unitKw) && u.n === unit);
                return !!found;
            })();
            if (!nameMatch && !codeMatch) return false;
        }
        if (catKw  && category !== catKw)                         return false;
        if (kw && !(
            log.operator.toLowerCase().includes(kw) ||
            log.action.toLowerCase().includes(kw)   ||
            detail.toLowerCase().includes(kw)       ||
            unit.toLowerCase().includes(kw)         ||
            category.toLowerCase().includes(kw)
        )) return false;
        return true;
    });

    currentPage = 1;
    document.getElementById('filter_count').textContent =
        filtered.length < allLogs.length
            ? `符合 ${filtered.length} 筆（共 ${allLogs.length} 筆）`
            : `共 ${allLogs.length} 筆`;

    renderTable();
    renderPagination();
}

function clearFilter() {
    document.getElementById('f_keyword').value  = '';
    document.getElementById('f_operator').value = '';
    document.getElementById('f_action').value   = '';
    document.getElementById('f_date').value     = '';
    document.getElementById('f_unit').value     = '';
    document.getElementById('f_category').value = '';
    applyFilter();
}

// ── RENDER TABLE ──
function renderTable() {
    const start  = (currentPage - 1) * PAGE_SIZE;
    const page   = filtered.slice(start, start + PAGE_SIZE);
    const tbody  = document.getElementById('audit_tbody');

    if (!page.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="audit-empty"><i class="fas fa-inbox"></i><br>目前無符合條件的紀錄</td></tr>';
        return;
    }

    const catColors = {
        '一般公告': 'background:rgba(70,120,200,0.1);color:#2a5ba0;',
        '全院宣導': 'background:rgba(60,160,80,0.1);color:#2a7a40;',
        '人資公告': 'background:rgba(200,140,30,0.13);color:#7a5000;',
        'JIT':      'background:rgba(150,60,180,0.1);color:#6a1a90;',
    };

    tbody.innerHTML = page.map(log => {
        const badgeClass = {
            '登入':'login','登出':'logout',
            '新增公告':'add','編輯公告':'edit','覆蓋公告':'add',
            '刪除公告':'delete','加入焦點輪播':'star','移除焦點輪播':'star',
            '跨月釘選':'pin','取消跨月釘選':'logout'
        }[log.action] || 'edit';

        const kw = document.getElementById('f_keyword').value.trim();
        const { detail, unit, category } = parseAuditDetail(log.detail);
        const detailHtml   = kw ? highlight(detail || '—', kw) : (detail || '—');
        const unitHtml     = kw ? highlight(unit, kw) : unit;
        const operatorHtml = kw ? highlight(log.operator, kw) : log.operator;

        const catStyle = catColors[category] || 'background:rgba(120,120,120,0.1);color:#555;';
        const catHtml  = category
            ? `<span class="audit-badge" style="${catStyle}">${category}</span>`
            : '<span style="color:var(--gray-400)">—</span>';

        // 動作顯示：新增公告 / 覆蓋公告 都顯示「新增／覆蓋公告」
        const actionLabel = (log.action === '新增公告' || log.action === '覆蓋公告')
            ? '新增／覆蓋公告' : log.action;

        const isPublish = (log.action === '新增公告' || log.action === '覆蓋公告');
        const descForConfirm = `${log.time}　${detail || '—'}`;
        const deleteBtn = isPublish
            ? `<button class="btn-row-delete" onclick="confirmDelete(${log.id}, '${descForConfirm.replace(/'/g,"\\'")}')" title="刪除此筆紀錄">
                   <i class="fas fa-trash-alt"></i> 刪除
               </button>`
            : '<span style="color:var(--gray-400);font-size:0.78rem;">—</span>';

        return `<tr>
            <td style="white-space:nowrap;color:var(--gray-500);font-variant-numeric:tabular-nums;">${log.time}</td>
            <td><strong>${operatorHtml}</strong></td>
            <td><span class="audit-badge ${badgeClass}">${actionLabel}</span></td>
            <td style="color:var(--gray-600);font-size:0.8rem;">${unitHtml || '<span style="color:var(--gray-400)">—</span>'}</td>
            <td style="color:var(--gray-500);">${detailHtml}</td>
            <td>${catHtml}</td>
            <td style="text-align:center;">${deleteBtn}</td>
        </tr>`;
    }).join('');
}

function highlight(text, kw) {
    if (!kw) return text;
    const re = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
    return text.replace(re, '<mark style="background:rgba(196,154,60,0.3);border-radius:2px;padding:0 1px;">$1</mark>');
}

// ── PAGINATION ──
function renderPagination() {
    const totalPages = Math.ceil(filtered.length / PAGE_SIZE);
    const el = document.getElementById('pagination');
    if (totalPages <= 1) { el.innerHTML = ''; return; }

    let html = '';
    html += `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>
        <i class="fas fa-chevron-left"></i>
    </button>`;

    for (let i = 1; i <= totalPages; i++) {
        if (totalPages > 8 && i > 3 && i < totalPages - 1 && Math.abs(i - currentPage) > 2) {
            if (i === 4 || i === totalPages - 2) html += `<span class="page-info">…</span>`;
            continue;
        }
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }

    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>
        <i class="fas fa-chevron-right"></i>
    </button>`;
    html += `<span class="page-info">第 ${currentPage} / ${totalPages} 頁</span>`;
    el.innerHTML = html;
}

function goPage(p) {
    const total = Math.ceil(filtered.length / PAGE_SIZE);
    if (p < 1 || p > total) return;
    currentPage = p;
    renderTable();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── EXPORT EXCEL ──
function exportExcel() {
    if (!filtered.length) { showToast('目前無資料可匯出', 'error'); return; }

    const wsData = [['時間','操作人員','動作','申請單位','說明','公告大項']];
    filtered.forEach(l => {
        const { detail, unit, category } = parseAuditDetail(l.detail);
        const actionLabel = (l.action === '新增公告' || l.action === '覆蓋公告') ? '新增／覆蓋公告' : l.action;
        wsData.push([l.time, l.operator, actionLabel, unit, detail, category]);
    });

    const ws = XLSX.utils.aoa_to_sheet(wsData);
    ws['!cols'] = [{wch:20},{wch:12},{wch:16},{wch:20},{wch:44},{wch:14}];

    const wb = XLSX.utils.book_new();
    const dateStr = new Date().toISOString().slice(0,10);
    XLSX.utils.book_append_sheet(wb, ws, '操作紀錄');
    XLSX.writeFile(wb, `操作紀錄_${dateStr}.xlsx`);
    showToast(`已匯出 ${filtered.length} 筆紀錄`);
}

// ── DELETE LOG ──
let _pendingDeleteId = null;

function confirmDelete(logId, desc) {
    _pendingDeleteId = logId;
    document.getElementById('confirm_desc').innerHTML =
        `確認後此筆紀錄將永久移除，統計數字將同步更新。<br><br>` +
        `<strong style="font-size:0.82rem;">${desc}</strong>`;
    document.getElementById('confirm_modal').classList.add('show');
}

function closeConfirm() {
    _pendingDeleteId = null;
    document.getElementById('confirm_modal').classList.remove('show');
}

function executeDelete() {
    if (!_pendingDeleteId) return;
    const id = _pendingDeleteId;
    const btn = document.getElementById('confirm_ok_btn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刪除中…';

    fetch('api/delete_audit_log.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
    })
    .then(r => r.json())
    .then(res => {
        closeConfirm();
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-trash-alt"></i> 確認刪除';
        if (res.success) {
            // 從本地陣列移除，免得重新 fetch
            allLogs = allLogs.filter(l => l.id !== id);
            updateStats();
            applyFilter();
            showToast('已刪除，統計已更新');
        } else {
            showToast(res.message || '刪除失敗，請稍後再試', 'error');
        }
    })
    .catch(() => {
        closeConfirm();
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-trash-alt"></i> 確認刪除';
        showToast('網路錯誤，刪除失敗', 'error');
    });
}

// 點擊背景關閉
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('confirm_modal').addEventListener('click', function(e) {
        if (e.target === this) closeConfirm();
    });
});

// ── TOAST ──
function showToast(msg, type = 'success') {
    const id = 'toast_' + Date.now();
    const icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
    document.getElementById('toast_container').insertAdjacentHTML('beforeend',
        `<div class="toast ${type}" id="${id}"><i class="fas ${icon}"></i><span>${msg}</span></div>`
    );
    setTimeout(() => {
        const el = document.getElementById(id);
        if (el) el.style.opacity = '0', el.style.transition = 'opacity 0.3s', setTimeout(() => el.remove(), 300);
    }, 3000);
}

// 篩選出現有 Log 中出現過的單位（動態建立），方便快速選取
function getLogUnits() {
    const set = new Set();
    allLogs.forEach(l => {
        const { unit } = parseAuditDetail(l.detail);
        if (unit) set.add(unit);
    });
    return [...set];
}

function buildUnitFilterHtml(kw) {
    const q = (kw || '').toLowerCase().trim();
    // 先列出 log 中實際出現的單位（若符合）
    const logUnits = getLogUnits();
    // 從完整清單搜尋
    const matches = q
        ? AUDIT_UNIT_LIST.filter(u => u.s.includes(q)).slice(0, 60)
        : AUDIT_UNIT_LIST.filter(u => logUnits.includes(u.n)).concat(
            AUDIT_UNIT_LIST.filter(u => !logUnits.includes(u.n))
          ).slice(0, 60);

    if (!matches.length) return '<div class="u-empty">無符合單位</div>';

    return matches.map(u => {
        const inLog = logUnits.includes(u.n);
        const dot = inLog ? '<span style="color:#2a7a40;margin-right:4px;font-size:0.7rem;">●</span>' : '';
        return `<div class="u-opt" onmousedown="selectUnitFilter('${u.n.replace(/'/g,"\\'")}')">${dot}<span class="u-code">${u.c}</span>${u.n.replace(u.c+'-','')}</div>`;
    }).join('');
}

function filterUnitDropdown() {
    const kw  = document.getElementById('f_unit').value;
    const dd  = document.getElementById('f_unit_dropdown');
    dd.innerHTML = buildUnitFilterHtml(kw);
    dd.style.display = 'block';
    applyFilter();   // 同步即時篩選
}

function showUnitFilterDropdown() {
    const dd  = document.getElementById('f_unit_dropdown');
    const kw  = document.getElementById('f_unit').value;
    dd.innerHTML = buildUnitFilterHtml(kw);
    dd.style.display = 'block';
}

function hideUnitFilterDropdown() {
    setTimeout(() => {
        document.getElementById('f_unit_dropdown').style.display = 'none';
    }, 180);
}

function selectUnitFilter(name) {
    document.getElementById('f_unit').value = name;
    document.getElementById('f_unit_dropdown').style.display = 'none';
    applyFilter();
}
</script>
