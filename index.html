<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>院內公告系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=noto-sans-tc:300,400,500,700&display=swap" rel="stylesheet" />

    <style>
        :root {
    --primary: #4a4e52; 
    --primary-mid: #6c757d;
    --primary-light: #adb5bd;
    --primary-pale: #f8f9fa; /* 極淺灰底 */
    --accent: #60666b;
    
    /* 增加白色系比例 */
    --white: #ffffff;
    --gray-50: #fdfcfb;  /* 近乎純白的奶油色 */
    --gray-100: #f5f2ed; 
    
    /* 強化玻璃感陰影：更淡、範圍更廣 */
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.08);
    --shadow-lg: 0 15px 50px rgba(0,0,0,0.1);
            --radius: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans TC', "Microsoft JhengHei", Arial, sans-serif;
            background: #f4f5f7;
            color: #333a40;
        }

        /* ══ WARM MILK TEA BACKGROUND ══ */
        body::before {
    background:
        radial-gradient(circle at 10% 15%, rgba(255, 255, 255, 1) 0%, transparent 50%),
        radial-gradient(ellipse 60% 55% at 90% 80%, rgba(200, 205, 215, 0.4) 0%, transparent 60%),
        linear-gradient(150deg, #ffffff 0%, #eceef1 40%, #dee2e6 100%) !important;
}

        /* Floating warm orbs */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle 400px at 80% 20%, rgba(210, 215, 225, 0.4) 0%, transparent 70%),
        radial-gradient(circle 300px at 15% 85%, rgba(255, 255, 255, 0.6) 0%, transparent 70%);
            z-index: -1;
            animation: floatOrbs 14s ease-in-out infinite alternate;
        }

        @keyframes floatOrbs {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(18px, -18px) scale(1.06); }
        }

        /* Subtle dot grid */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-image: radial-gradient(circle, rgba(140, 100, 60, 0.1) 1px, transparent 1px);
            background-size: 36px 36px;
            pointer-events: none;
        }

        /* ══ TOP HEADER BAR ══ */
        .top-bar {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 200;
            box-shadow: 0 2px 16px rgba(140,100,60,0.1);
        }

        .top-bar-inner {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .brand-icon img {
            width: 40px; height: 40px;
            object-fit: contain;
            object-position: center;
        }

        .brand-name {
            color: var(--primary);
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .brand-sub {
            color: rgba(122,92,58,0.5);
            font-size: 0.7rem;
            margin-top: 1px;
            letter-spacing: 0.08em;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-date {
            color: rgba(90,58,30,0.55);
            font-size: 0.8rem;
        }

        .btn-admin-toggle {
            background: rgba(122,92,58,0.1);
            border: 1px solid rgba(122,92,58,0.22);
            color: var(--primary);
            padding: 7px 16px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-admin-toggle:hover {
            background: rgba(122,92,58,0.18);
            border-color: rgba(122,92,58,0.38);
        }

        /* ══ LAYOUT ══ */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 24px 20px;
        }

        /* ══ ADMIN PANEL ══ */
        #div_manage {
            background: rgba(255, 248, 238, 0.58);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.72);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(140,100,60,0.1), inset 0 1px 0 rgba(255,255,255,0.9);
            margin-bottom: 24px;
            overflow: hidden;
            display: none;
        }

        .manage-header {
            background: rgba(122,92,58,0.07);
            border-bottom: 1px solid rgba(122,92,58,0.1);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .manage-header-icon {
            width: 28px; height: 28px;
            background: rgba(122,92,58,0.12);
            border: 1px solid rgba(122,92,58,0.2);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            font-size: 13px;
        }

        .manage-header h2 {
            color: var(--primary);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.03em;
        }

        .manage-body { padding: 22px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group { display: flex; flex-direction: column; gap: 6px; }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gray-600);
            letter-spacing: 0.03em;
        }

        .form-control {
            padding: 9px 12px;
            border: 1.5px solid rgba(122,92,58,0.18);
            border-radius: 7px;
            font-size: 0.9rem;
            font-family: inherit;
            color: var(--gray-800);
            background: rgba(255,248,238,0.65);
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-control::placeholder { color: var(--gray-400); }

        .form-control:focus {
            outline: none;
            border-color: rgba(122,92,58,0.4);
            background: rgba(255,252,245,0.9);
            box-shadow: 0 0 0 3px rgba(122,92,58,0.1);
        }

        select.form-control { cursor: pointer; }
        select.form-control option { background: #faf5ed; color: var(--gray-800); }

        .file-upload-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .file-upload-box {
            border: 1.5px dashed rgba(122,92,58,0.22);
            border-radius: 8px;
            padding: 12px;
            background: rgba(255,248,238,0.4);
            transition: border-color 0.2s, background 0.2s;
        }

        .file-upload-box:hover {
            border-color: rgba(122,92,58,0.42);
            background: rgba(255,248,238,0.65);
        }

        .file-type-label {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .file-type-label.img { color: var(--teal); }
        .file-type-label.pdf { color: var(--red); }

        input[type="file"].form-control {
            padding: 6px 10px;
            font-size: 0.82rem;
        }

        .manage-actions { display: flex; justify-content: flex-end; }

        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 10px 22px; border: none; border-radius: 7px;
            font-size: 0.9rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; font-family: inherit; text-decoration: none;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff8ee;
        }
        .btn-primary:hover {
            background: var(--primary-mid);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(122,92,58,0.28);
        }

        .btn-success {
            background: #7a5c3a;
            color: #fff8ee;
        }
        .btn-success:hover {
            background: #6b4e2e;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(100,70,35,0.28);
        }

        .btn-secondary {
            background: rgba(122,92,58,0.08);
            color: var(--gray-600);
            border: 1px solid rgba(122,92,58,0.18);
        }
        .btn-secondary:hover {
            background: rgba(122,92,58,0.14);
            color: var(--gray-800);
        }

        /* ══ CAROUSEL SECTION ══ */
        .section-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px) saturate(120%);
            -webkit-backdrop-filter: blur(15px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04), 
        inset 0 0 0 1px rgba(255, 255, 255, 0.3);
            margin-bottom: 24px;
            overflow: hidden;
        }

        .section-card-header {
            padding: 16px 22px;
            border-bottom: 1px solid rgba(122,92,58,0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,248,238,0.35);
        }

        .section-card-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
        }

        .section-card-title-icon {
            width: 30px; height: 30px;
            background: rgba(122,92,58,0.1);
            border: 1px solid rgba(122,92,58,0.18);
            border-radius: 7px;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary-mid);
            font-size: 13px;
        }

        .section-card-body { padding: 20px; }

        /* Carousel dots override */
        .owl-theme .owl-dots .owl-dot.active span,
        .owl-theme .owl-dots .owl-dot:hover span {
            background: var(--primary);
        }

        .owl-theme .owl-dots .owl-dot span {
            width: 8px; height: 8px;
            background: rgba(122,92,58,0.2);
        }

        .carousel-item-box {
            aspect-ratio: 4 / 3;
            background: var(--gray-100);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .carousel-item-box img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .carousel-item-box:hover img { transform: scale(1.03); }

        .carousel-caption {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            color: white;
            padding: 20px 12px 10px;
            font-size: 0.82rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 格數切換按鈕：僅管理員模式顯示 */
        #layout_btns { display: none; }
        body.admin-mode #layout_btns { display: flex; }

        /* ══ 輪播格數切換 ══ */
        .carousel-layout-btns {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .layout-btn {
            width: 32px; height: 32px;
            border: 1px solid rgba(122,92,58,0.2);
            border-radius: 7px;
            background: rgba(255,248,238,0.5);
            color: var(--gray-400);
            font-size: 12px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
            position: relative;
        }

        .layout-btn:hover {
            background: rgba(122,92,58,0.1);
            color: var(--primary);
            border-color: rgba(122,92,58,0.35);
        }

        .layout-btn.active {
            background: var(--primary);
            color: #fff8ee;
            border-color: var(--primary);
        }

        /* 格數圖示：用 grid 小方塊模擬 */
        .layout-icon {
            display: grid;
            gap: 2px;
        }
        .layout-icon.cols-1 { grid-template-columns: 1fr; width: 10px; }
        .layout-icon.cols-2 { grid-template-columns: 1fr 1fr; width: 12px; }
        .layout-icon.cols-3 { grid-template-columns: 1fr 1fr 1fr; width: 14px; }
        .layout-icon.cols-4 { grid-template-columns: 1fr 1fr 1fr 1fr; width: 16px; }

        .layout-icon span {
            display: block;
            height: 8px;
            border-radius: 1px;
            background: currentColor;
            opacity: 0.85;
        }
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--gray-600);
            white-space: nowrap;
        }

        input[type="month"].form-control {
            width: auto;
            padding: 7px 10px;
            font-size: 0.85rem;
        }

        /* TABLE */
        .announcement-table {
            width: 100%;
            border-collapse: collapse;
        }

        .announcement-table thead th {
            padding: 11px 14px;
            background: rgba(122,92,58,0.05);
            color: var(--gray-600);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(122,92,58,0.1);
            text-align: left;
            white-space: nowrap;
        }

        .announcement-table tbody tr {
            border-bottom: 1px solid rgba(122,92,58,0.07);
            transition: background 0.15s;
            cursor: pointer;
        }

        .announcement-table tbody tr:hover {
            background: rgba(255,248,238,0.6);
        }

        .announcement-table tbody tr:last-child { border-bottom: none; }

        .announcement-table td {
            padding: 13px 14px;
            font-size: 0.88rem;
            vertical-align: middle;
        }

/* 預設隱藏管理欄位與標題 */
.col-manage, 
th.col-manage {
    display: none !important;
}

/* 當處於管理模式時，強制以 table-cell 顯示以維持對齊 */
body.admin-mode .col-manage,
body.admin-mode th.col-manage {
    display: table-cell !important;
    width: 175px;
    min-width: 175px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
}

/* 確保按鈕在 cell 內水平置中 */
.col-manage .button-container {
    display: flex;
    justify-content: center;
    gap: 4px;
}

        /* BADGE */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            white-space: nowrap;
        }

        .badge-全院宣導 { background: rgba(184,92,74,0.1);  color: #9a3a28; border: 1px solid rgba(184,92,74,0.2); }
        .badge-人資公告 { background: rgba(106,143,122,0.12); color: #3d6e58; border: 1px solid rgba(106,143,122,0.22); }
        .badge-一般公告 { background: rgba(108, 117, 125, 0.1);  color: #495057; border: 1px solid rgba(108, 117, 125, 0.2); }
        .badge-JIT     { background: rgba(196,120,64,0.1);  color: #8a4c18; border: 1px solid rgba(196,120,64,0.2); }

        .title-text {
            font-weight: 500;
            color: var(--gray-800);
            font-size: 0.9rem;
        }

        .date-text {
            color: var(--gray-400);
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
        }

        /* ── 分組標題列 ── */
        .group-header { pointer-events: none; }
        .group-header td {
            padding: 7px 14px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.09em;
            border-bottom: none !important;
        }
        .group-header.g-starred td {
            background: rgba(196,154,60,0.09);
            color: #7a5800;
            border-top: 2px solid rgba(196,154,60,0.25) !important;
            border-bottom: 1px solid rgba(196,154,60,0.18) !important;
        }
        .group-header.g-monthly td {
            background: rgba(100,90,80,0.05);
            color: var(--gray-400);
            border-top: 2px solid rgba(122,92,58,0.12) !important;
            border-bottom: 1px solid rgba(122,92,58,0.1) !important;
        }
        .group-header.g-pinned td {
            background: rgba(106,143,122,0.09);
            color: #3a6650;
            border-top: 2px solid rgba(106,143,122,0.25) !important;
            border-bottom: 1px solid rgba(106,143,122,0.18) !important;
        }
        /* 星號列加淡黃底 */
        tr.row-pinned td { background: rgba(255,250,235,0.7); }
        tr.row-pinned:hover td { background: rgba(255,248,220,0.95) !important; }

        /* ACTION BTNS in table */
        .action-btn {
            width: 30px; height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 13px;
            transition: all 0.15s;
            margin: 0 1px;
            flex-shrink: 0;
        }

        .btn-star {
            background: rgba(122,92,58,0.07);
            color: var(--gray-400);
            border: 1px solid rgba(122,92,58,0.14);
        }

        .btn-star.active {
            background: rgba(196,154,60,0.15);
            color: #a07820;
            border: 1px solid rgba(196,154,60,0.28);
        }

        .btn-star:hover { background: rgba(196,154,60,0.12); color: #a07820; }

        .btn-pin {
            background: rgba(106,143,122,0.08);
            color: var(--gray-400);
            border: 1px solid rgba(106,143,122,0.18);
        }
        .btn-pin.active {
            background: rgba(106,143,122,0.18);
            color: #3a6650;
            border: 1px solid rgba(106,143,122,0.35);
        }
        .btn-pin:hover { background: rgba(106,143,122,0.15); color: #3a6650; }

        /* 釘選列（淡綠底） */
        .row-pinned-only { background: rgba(106,143,122,0.06) !important; }
        tr.row-pinned-only:hover td { background: rgba(106,143,122,0.12) !important; }

        .btn-del {
            background: rgba(184,92,74,0.09);
            color: var(--red);
            border: 1px solid rgba(184,92,74,0.18);
        }
        .btn-del:hover { background: var(--red); color: white; }

        .btn-edit {
            background: rgba(122,92,58,0.09);
            color: var(--primary-mid);
            border: 1px solid rgba(122,92,58,0.18);
        }
        .btn-edit:hover { background: var(--primary); color: #fff8ee; }

        /* VIEW ICONS */
        .view-icons { display: flex; gap: 6px; align-items: center; }

        .view-icon-btn {
            width: 32px; height: 32px;
            border-radius: 7px;
            display: inline-flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
            text-decoration: none;
        }

        .view-icon-btn.img {
            background: rgba(106,143,122,0.1);
            color: var(--teal);
            border: 1px solid rgba(106,143,122,0.2);
        }
        .view-icon-btn.img:hover { background: var(--teal); color: white; }

        .view-icon-btn.pdf {
            background: rgba(184,92,74,0.1);
            color: var(--red);
            border: 1px solid rgba(184,92,74,0.2);
        }
        .view-icon-btn.pdf:hover { background: var(--red); color: white; }

        .view-icon-btn.link {
            background: rgba(100,110,200,0.1);
            color: #5560c8;
            border: 1px solid rgba(100,110,200,0.22);
        }
        .view-icon-btn.link:hover { background: #5560c8; color: white; }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-400);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
            color: var(--gray-200);
        }

        .empty-state p { font-size: 0.9rem; }

        /* ══ MODAL ══ */
        .modal-overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(100,70,40,0.2);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .modal-box {
            background: rgba(255, 248, 238, 0.78);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255,255,255,0.88);
            border-radius: 14px;
            width: 92%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(140,100,60,0.18), inset 0 1px 0 rgba(255,255,255,1);
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(-10px); }
            to { opacity: 1; transform: none; }
        }

        .modal-header {
            background: rgba(122,92,58,0.07);
            border-bottom: 1px solid rgba(122,92,58,0.1);
            padding: 16px 22px;
            color: var(--primary);
            font-size: 1rem;
            font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }

        .modal-body { padding: 22px; }

        .modal-footer {
            padding: 16px 22px;
            border-top: 1px solid rgba(122,92,58,0.09);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: rgba(255,248,238,0.35);
        }

        /* ══ TOAST ══ */
        .toast-container {
            position: fixed;
            top: 76px; right: 20px;
            z-index: 3000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: rgba(255, 248, 238, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.88);
            border-radius: 8px;
            padding: 12px 18px;
            box-shadow: 0 8px 28px rgba(140,100,60,0.14);
            display: flex; align-items: center; gap: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--gray-800);
            min-width: 240px;
            animation: toastIn 0.3s ease;
            border-left: 3px solid var(--teal);
        }

        .toast.error { border-left-color: var(--red); }
        .toast i { font-size: 1rem; }
        .toast.success i { color: var(--teal); }
        .toast.error i { color: var(--red); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: none; }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--gray-400);
        }

        .empty-state i {
            font-size: 2.5rem;
            margin-bottom: 12px;
            display: block;
            color: rgba(0,80,180,0.12);
        }

        .empty-state p { font-size: 0.9rem; }

        /* ══ STATS ROW ══ */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(255, 248, 238, 0.6);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.75);
            border-radius: var(--radius);
            padding: 18px 20px;
            box-shadow: 0 4px 20px rgba(140,100,60,0.1), inset 0 1px 0 rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            gap: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(140,100,60,0.15), inset 0 1px 0 rgba(255,255,255,0.9);
        }

        .stat-icon {
            width: 44px; height: 44px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .stat-icon.blue   { background: rgba(74, 78, 82, 0.1);  color: #4a4e52; }
        .stat-icon.red    { background: rgba(184,92,74,0.12);  color: #a0422e; }
        .stat-icon.teal   { background: rgba(106,143,122,0.15); color: #4a7260; }
        .stat-icon.orange { background: rgba(196,120,64,0.12); color: #9a5c25; }

        .stat-num {
            font-size: 1.7rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.74rem;
            color: var(--gray-400);
            margin-top: 3px;
            font-weight: 500;
        }

        /* ── 操作紀錄面板 ── */
        .audit-panel { display: none; margin-top: 20px; }
        body.admin-mode .audit-panel { display: block; }
        .audit-toolbar {
            display: flex; align-items: center; gap: 10px;
            margin-bottom: 12px; flex-wrap: wrap;
        }
        .audit-toolbar h3 {
            font-size: 1rem; font-weight: 600;
            color: var(--gray-700); margin: 0; flex: 1;
        }
        .audit-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .audit-filter select, .audit-filter input {
            font-size: 0.82rem; padding: 4px 10px;
            border: 1px solid rgba(122,92,58,0.2);
            border-radius: 7px; background: rgba(255,248,238,0.7);
            color: var(--gray-700); height: 32px;
        }
        .audit-table-wrap {
            overflow-x: auto; border-radius: 10px;
            border: 1px solid rgba(122,92,58,0.13);
        }
        .audit-table {
            width: 100%; border-collapse: collapse;
            font-size: 0.83rem; background: rgba(255,255,255,0.5);
        }
        .audit-table th {
            background: rgba(122,92,58,0.08); color: var(--gray-600);
            font-weight: 600; padding: 9px 12px; text-align: left;
            border-bottom: 1px solid rgba(122,92,58,0.12); white-space: nowrap;
        }
        .audit-table td {
            padding: 8px 12px; border-bottom: 1px solid rgba(122,92,58,0.07);
            color: var(--gray-700); vertical-align: middle;
        }
        .audit-table tr:last-child td { border-bottom: none; }
        .audit-table tr:hover td { background: rgba(122,92,58,0.04); }
        .audit-badge {
            display: inline-block; font-size: 0.75rem;
            padding: 2px 9px; border-radius: 20px; font-weight: 500;
        }
        .audit-badge.login  { background: rgba(60,160,80,0.12);  color: #2a7a40; }
        .audit-badge.logout { background: rgba(120,120,120,0.12); color: #555; }
        .audit-badge.add    { background: rgba(70,120,200,0.12);  color: #2a5ba0; }
        .audit-badge.edit   { background: rgba(200,140,30,0.13);  color: #7a5000; }
        .audit-badge.delete { background: rgba(200,60,60,0.12);   color: #a02020; }
        .audit-badge.star   { background: rgba(200,160,0,0.13);   color: #806000; }
        .audit-empty { text-align: center; padding: 32px; color: var(--gray-400); font-size: 0.88rem; }

        /* ══ RESPONSIVE ══ */
        @media (max-width: 768px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .form-grid { grid-template-columns: 1fr; }
            .file-upload-row { grid-template-columns: 1fr; }
            .announcement-table thead { display: none; }
            .announcement-table td { display: block; padding: 6px 12px; border: none; }
            .announcement-table tr { border-bottom: 1px solid var(--gray-200); display: block; padding: 8px 0; }
            .col-manage { text-align: left !important; width: 100%; }
            .filter-bar { flex-wrap: wrap; }
            .header-date { display: none; }
        }

        @media (max-width: 480px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .top-bar-inner { padding: 0 12px; }
            .main-container { padding: 16px 12px; }
        }

        /* ══ LOGIN MODAL ══ */
        /* 編輯 modal 內的上傳區改為單欄，避免橫向溢出 */
        #modal_edit .file-upload-row {
            grid-template-columns: 1fr;
        }

        #modal_login .modal-box {
            max-width: 380px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-8px); }
            40%       { transform: translateX(8px); }
            60%       { transform: translateX(-5px); }
            80%       { transform: translateX(5px); }
        }

        .login-icon-wrap {
            text-align: center;
            margin-bottom: 20px;
        }

        .login-icon-wrap .login-avatar {
            width: 64px; height: 64px;
            border-radius: 50%;
            background: rgba(122,92,58,0.1);
            border: 2px solid rgba(122,92,58,0.2);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .login-icon-wrap p {
            font-size: 0.82rem;
            color: var(--gray-400);
        }

        .login-error {
            display: none;
            background: rgba(184,92,74,0.1);
            border: 1px solid rgba(184,92,74,0.25);
            color: #8a3a28;
            border-radius: 7px;
            padding: 9px 13px;
            font-size: 0.83rem;
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 7px;
        }

        .login-error.show { display: flex; }

        .pw-input-wrap {
            position: relative;
        }

        .pw-input-wrap .form-control {
            padding-right: 42px;
        }

        .pw-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            transition: color 0.2s;
        }

        .pw-toggle:hover { color: var(--primary); }

        /* Carousel nav arrows */
        .owl-carousel .owl-nav button.owl-prev,
        .owl-carousel .owl-nav button.owl-next {
            width: 32px; height: 32px;
            border-radius: 50% !important;
            background: rgba(122,92,58,0.12) !important;
            border: 1px solid rgba(122,92,58,0.2) !important;
            color: var(--primary) !important;
            font-size: 13px !important;
            transition: all 0.15s;
            position: absolute;
            top: 50%; transform: translateY(-50%);
        }
        .owl-carousel .owl-nav button.owl-prev { left: -14px; }
        .owl-carousel .owl-nav button.owl-next { right: -14px; }
        .owl-carousel .owl-nav button:hover {
            background: var(--primary) !important;
            color: #fff8ee !important;
        }
        .owl-stage-outer { padding: 4px 2px; }

        /* Spinner */
        .spinner { animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Owl nav override */
        .owl-carousel .owl-nav.disabled { display: none; }

        /* ══ LIGHTBOX ══ */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: rgba(30, 20, 10, 0.82);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            align-items: center;
            justify-content: center;
            animation: lbFadeIn 0.25s ease;
            cursor: zoom-out;
        }

        #lightbox.active { display: flex; }

        @keyframes lbFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .lb-inner {
            position: relative;
            max-width: 92vw;
            max-height: 90vh;
            cursor: default;
            animation: lbZoomIn 0.28s cubic-bezier(0.34,1.56,0.64,1);
        }

        @keyframes lbZoomIn {
            from { opacity: 0; transform: scale(0.88); }
            to   { opacity: 1; transform: scale(1); }
        }

        #lb_img {
            display: block;
            max-width: 92vw;
            max-height: 85vh;
            border-radius: 10px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.55);
            object-fit: contain;
            user-select: none;
        }

        .lb-caption {
            margin-top: 12px;
            text-align: center;
            color: rgba(255,255,255,0.75);
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.03em;
        }

        .lb-close {
            position: fixed;
            top: 18px;
            right: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            z-index: 9001;
        }

        .lb-close:hover {
            background: rgba(255,255,255,0.22);
            transform: scale(1.1) rotate(90deg);
        }

        .lb-open-btn {
            position: absolute;
            bottom: 46px;
            right: 10px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.25);
            color: white;
            font-size: 0.78rem;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background 0.2s;
            text-decoration: none;
        }

        .lb-open-btn:hover { background: rgba(255,255,255,0.25); }

        /* ══ 申請辦法按鈕 ══ */
        .btn-apply-rules {
            background: linear-gradient(135deg, rgba(214,149,82,0.18) 0%, rgba(214,149,82,0.08) 100%);
            border: 1px solid rgba(214,149,82,0.38);
            color: #9a5b2e;
            padding: 7px 15px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: inherit;
            letter-spacing: 0.02em;
        }
        .btn-apply-rules:hover {
            background: linear-gradient(135deg, rgba(214,149,82,0.28) 0%, rgba(214,149,82,0.15) 100%);
            border-color: rgba(214,149,82,0.6);
            box-shadow: 0 3px 12px rgba(184,110,50,0.18);
            transform: translateY(-1px);
        }
        .btn-apply-rules i { font-size: 0.78rem; }

        /* ══ 申請辦法 Modal ══ */
        #modal_apply {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9000;
            background: rgba(30, 20, 10, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            align-items: center;
            justify-content: center;
            animation: applyFadeIn 0.22s ease;
        }
        #modal_apply.active { display: flex; }

        @keyframes applyFadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        .apply-modal-box {
            background: rgba(255, 253, 249, 0.97);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.72);
            border-radius: 22px;
            box-shadow: 0 24px 80px rgba(120, 80, 30, 0.22), inset 0 1px 0 rgba(255,255,255,0.9);
            width: 90vw;
            max-width: 680px;
            height: 86vh;
            display: flex;
            flex-direction: column;
            position: relative;
            animation: applyZoomIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
            overflow: hidden;
        }

        @keyframes applyZoomIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .apply-modal-box::-webkit-scrollbar { width: 6px; }
        .apply-modal-box::-webkit-scrollbar-track { background: transparent; }
        .apply-modal-box::-webkit-scrollbar-thumb { background: rgba(180,130,80,0.25); border-radius: 99px; }

        .apply-modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.85);
            border: 1px solid rgba(180,130,80,0.25);
            color: #9a5b2e;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .apply-modal-close:hover {
            background: rgba(214,149,82,0.15);
            border-color: rgba(214,149,82,0.5);
            transform: rotate(90deg) scale(1.1);
        }

        .apply-modal-content {
            padding: 0 8px 24px;
            clear: both;
        }
    </style>
</head>
<body>

<div class="bg-grid"></div>

<!-- TOP BAR -->
<header class="top-bar">
    <div class="top-bar-inner">
        <div class="brand">
            <div class="brand-icon"><img src="img/favicon.png"></div>
            <div>
                <div class="brand-name">院內輪播公告系統</div>
                <div class="brand-sub">ANNOUNCEMENT BOARD</div>
            </div>
        </div>
        <div class="header-right">
            <span class="header-date" id="header_date"></span>
            <button class="btn-apply-rules" onclick="openApplyModal()">
                <i class="fas fa-file-alt"></i> 申請辦法
            </button>
        </div>
    </div>
</header>

<div class="main-container">

    <!-- STATS ROW -->
    <div class="stats-row" id="stats_row">
        <div class="stat-card">
            <div class="stat-icon blue"><i class="fas fa-bullhorn"></i></div>
            <div>
                <div class="stat-num" id="stat_general">—</div>
                <div class="stat-label">一般公告</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red"><i class="fas fa-broadcast-tower"></i></div>
            <div>
                <div class="stat-num" id="stat_all">—</div>
                <div class="stat-label">全院宣導</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon teal"><i class="fas fa-users"></i></div>
            <div>
                <div class="stat-num" id="stat_hr">—</div>
                <div class="stat-label">人資公告</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon orange"><i class="fas fa-smile"></i></div>
            <div>
                <div class="stat-num" id="stat_jit">—</div>
                <div class="stat-label">JIT</div>
            </div>
        </div>
    </div>
    <!-- 年份統計說明列 -->
    <div id="stats_year_bar" style="text-align:right; margin:-16px 0 16px; font-size:0.78rem; color:var(--gray-400);">
        統計年度：<select id="stats_year_picker" style="
            border:1px solid rgba(122,92,58,0.18); border-radius:5px;
            background:rgba(255,248,238,0.7); color:var(--gray-600);
            font-size:0.78rem; padding:2px 8px; cursor:pointer; font-family:inherit;
        "></select> 年（各類別全年發佈總數）
    </div>

    <!-- CAROUSEL SECTION -->
    <div class="section-card">
        <div class="section-card-header">
            <div class="section-card-title">
                <div class="section-card-title-icon"><i class="fas fa-star"></i></div>
                重要焦點公告
            </div>
            <div style="display:flex; align-items:center; gap:16px;">
                <!-- 格數切換 -->
                <div class="carousel-layout-btns" id="layout_btns">
                    <button class="layout-btn" data-cols="1" title="單欄顯示">
                        <div class="layout-icon cols-1"><span></span></div>
                    </button>
                    <button class="layout-btn" data-cols="2" title="2欄顯示">
                        <div class="layout-icon cols-2"><span></span><span></span></div>
                    </button>
                    <button class="layout-btn active" data-cols="3" title="3欄顯示（預設）">
                        <div class="layout-icon cols-3"><span></span><span></span><span></span></div>
                    </button>
                    <button class="layout-btn" data-cols="4" title="4欄顯示">
                        <div class="layout-icon cols-4"><span></span><span></span><span></span><span></span></div>
                    </button>
                </div>
                <span style="font-size:0.78rem; color:rgba(90,60,30,0.42);">★ 一般放置時長為1週，若有特殊需求請洽下方聯絡資訊</span>
            </div>
        </div>
        <div class="section-card-body">
            <div id="div_owl" class="owl-carousel owl-theme"></div>
            <div id="carousel_empty" style="display:none; text-align:center; padding:32px; color:var(--gray-400); font-size:0.88rem;">
                <i class="fas fa-images" style="font-size:2rem; display:block; margin-bottom:8px; color:rgba(122,92,58,0.18);"></i>
                目前無焦點公告，請在列表中點選 ★ 加入輪播
            </div>
        </div>
    </div>

    <!-- LIST SECTION -->
    <div class="section-card">
        <div class="section-card-header">
            <div class="section-card-title">
                <div class="section-card-title-icon"><i class="fas fa-list-ul"></i></div>
                公告列表
            </div>
            <div class="filter-bar">
                <span class="filter-label">月份篩選</span>
                <input type="month" id="month_picker" class="form-control">
            </div>
        </div>
        <div class="section-card-body" style="padding:0;">
            <table class="announcement-table" id="announcement_list">
                <thead>
                    <tr>
                        <th width="110">日期</th>
                        <th width="95">類別</th>
                        <th>標題內容</th>
                        <th width="90">查看</th>
                    </tr>
                </thead>
                <tbody id="starred_tbody"></tbody>
                <tbody id="pinned_tbody"></tbody>
                <tbody id="monthly_tbody">
                    <tr><td colspan="5">
                        <div class="empty-state">
                            <i class="fas fa-spinner spinner"></i>
                            <p>載入中...</p>
                        </div>
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div><!-- end .main-container -->

<!-- TOAST CONTAINER -->
<div class="toast-container" id="toast_container"></div>

<!-- LIGHTBOX -->
<div id="lightbox" onclick="closeLightbox()">
    <button class="lb-close" onclick="closeLightbox()" title="關閉"><i class="fas fa-times"></i></button>
    <div class="lb-inner" onclick="event.stopPropagation()">
        <img id="lb_img" src="" alt="">
        <a id="lb_open_btn" class="lb-open-btn" href="#" target="_blank">
            <i class="fas fa-external-link-alt"></i> 在新分頁開啟
        </a>
        <div class="lb-caption" id="lb_caption"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap Icons（供申請辦法 Modal 使用，不載入完整 Bootstrap CSS） -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<!-- 申請辦法 Modal（iframe 動態載入 preview.html，更新內容後自動連動） -->
<div id="modal_apply" onclick="closeApplyModal()">
    <div class="apply-modal-box" onclick="event.stopPropagation()">
        <button class="apply-modal-close" onclick="closeApplyModal()" title="關閉">
            <i class="fas fa-times"></i>
        </button>
        <iframe
            id="apply_iframe"
            src=""
            style="width:100%; height:calc(86vh - 10px); border:none; border-radius:0 0 22px 22px; display:block; flex:1;"
            loading="lazy"
            onload="resizeApplyIframe(this)"
        ></iframe>
    </div>
</div>

<script>
function openApplyModal() {
    const m = document.getElementById('modal_apply');
    const iframe = document.getElementById('apply_iframe');
    // 每次開啟加上時間戳，強制瀏覽器取得最新版 preview.html（避免快取）
    iframe.src = 'preview.html?t=' + Date.now();
    m.classList.add('active');
    document.body.style.overflow = 'hidden';
}
function resizeApplyIframe(iframe) {
    try {
        // 讓 iframe 高度自動符合內容，不超過 modal 高度
        const contentH = iframe.contentDocument.documentElement.scrollHeight;
        const maxH = window.innerHeight * 0.9 - 10;
        iframe.style.height = Math.min(contentH, maxH) + 'px';
    } catch(e) { /* 跨域時忽略 */ }
}
function closeApplyModal() {
    document.getElementById('modal_apply').classList.remove('active');
    document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeApplyModal();
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

<script>
let owl;
let allData = [];

// ── TOAST ──
function showToast(msg, type = 'success') {
    const id = 'toast_' + Date.now();
    const icon = type === 'success' ? 'fa-check-circle' : 'fa-times-circle';
    const html = `<div class="toast ${type}" id="${id}">
        <i class="fas ${icon}"></i><span>${msg}</span>
    </div>`;
    $('#toast_container').append(html);
    setTimeout(() => { $(`#${id}`).fadeOut(300, function(){ $(this).remove(); }); }, 3000);
}

// ── STATS ──
function updateStats(data) {
    const year = parseInt($('#stats_year_picker').val()) || new Date().getFullYear();
    const yearData = data.filter(d => d.date && d.date.startsWith(String(year)));
    $('#stat_general').text(yearData.filter(d => d.status === '一般公告').length);
    $('#stat_all').text(yearData.filter(d => d.status === '全院宣導').length);
    $('#stat_hr').text(yearData.filter(d => d.status === '人資公告').length);
    $('#stat_jit').text(yearData.filter(d => d.status === 'JIT').length);
}

function initStatsYearPicker(data) {
    const currentYear = new Date().getFullYear();
    const years = [...new Set(data.map(d => d.date ? d.date.substring(0, 4) : null).filter(Boolean))]
        .map(Number).sort((a, b) => b - a);
    if (!years.includes(currentYear)) years.unshift(currentYear);
    const $sel = $('#stats_year_picker').empty();
    years.forEach(y => {
        $sel.append(`<option value="${y}"${y === currentYear ? ' selected' : ''}>${y}</option>`);
    });
    $sel.on('change', () => updateStats(allData));
}

// ── INIT ──
$(document).ready(function(){
    const now = new Date();
    $('#header_date').text(now.toLocaleDateString('zh-TW', { year:'numeric', month:'long', day:'numeric', weekday:'short' }));

    const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
    $("#month_picker").val(currentMonth);

    initOwl();
    loadData(currentMonth);

    $("#month_picker").on("change", function(){
        const sel = $(this).val();
        if (sel) renderTable(allData, sel);
    });

    $(document).on('keydown', function(e) {
        if (e.key === 'Escape' && document.getElementById('lightbox').classList.contains('active')) {
            closeLightbox();
        }
    });
});

// ── OWL CAROUSEL ──
let carouselCols = 3;

function initOwl() {
    owl = $("#div_owl").owlCarousel(buildOwlOptions(carouselCols));
}

function buildOwlOptions(cols) {
    const mid = Math.min(cols, 2);
    return {
        margin: 12, autoplay: true, autoplayTimeout: 2500,
        smartSpeed: 500, autoplayHoverPause: true, dots: true, nav: false,
        responsive: {
            0:    { items: 1,    loop: true },
            600:  { items: mid,  loop: true },
            1000: { items: cols, loop: true }
        }
    };
}

function refreshCarouselEmpty() {
    const count = $("#div_owl .item").length;
    $('#carousel_empty').toggle(count === 0);
}

// ── LOAD DATA ──
function loadData(filterMonth = "") {
    fetch('data.json?t=' + Date.now())
    .then(r => r.json())
    .then(data => {
        allData = data;
        const currentInOwl = owl.find('.owl-item').length;
        if (currentInOwl === 0) {
            data.forEach(item => { if (item.isStarred) addToCarousel(item); });
            owl.trigger('refresh.owl.carousel');
        }
        refreshCarouselEmpty();
        initStatsYearPicker(data);
        updateStats(data);
        renderTable(data, filterMonth);
    })
    .catch(() => showToast('無法讀取公告資料', 'error'));
}

function addToCarousel(item) {
    const titleEsc = item.title.replace(/'/g, "\\'");
    const src = item.imgPath || item.pdfPath || '';
    const html = `<div class="item" data-id="${item.id}">
        <div class="carousel-item-box" onclick="viewFile('${src}','${titleEsc}')">
            <img src="${item.imgPath || 'https://placehold.co/800x600/e8d8c0/7a5c3a?text=PDF+公告'}" alt="${item.title}">
            <div class="carousel-caption">${item.title}</div>
        </div>
    </div>`;
    owl.trigger('add.owl.carousel', [$(html)]);
}

// ── RENDER TABLE ──
function renderTable(data, filterMonth) {
    const $sTbody = $('#starred_tbody').empty();
    const $pTbody = $('#pinned_tbody').empty();
    const $mTbody = $('#monthly_tbody').empty();

    const starredItems = data.filter(d => d.isStarred);
    if (starredItems.length > 0) {
        $sTbody.append(`<tr class="group-header g-starred">
            <td colspan="4"><i class="fas fa-star" style="margin-right:6px;color:#c49a3c;"></i>焦點輪播（共 ${starredItems.length} 則，跨月固定顯示）</td>
        </tr>`);
        starredItems.forEach(item => renderRow(item, '#starred_tbody'));
    }

    const pinnedItems = data.filter(d => d.isPinned && !d.isStarred);
    if (pinnedItems.length > 0) {
        $pTbody.append(`<tr class="group-header g-pinned">
            <td colspan="4"><i class="fas fa-thumbtack" style="margin-right:6px;color:#3a6650;"></i>跨月釘選（共 ${pinnedItems.length} 則，跨月固定顯示・不在輪播）</td>
        </tr>`);
        pinnedItems.forEach(item => renderRow(item, '#pinned_tbody'));
    }

    const monthLabel = filterMonth ? filterMonth.replace(/^(\d+)-(\d+)$/, '$1 年 $2 月') : '全部';
    const monthlyItems = filterMonth
        ? data.filter(d => d.date.startsWith(filterMonth) && !d.isStarred && !d.isPinned)
        : data.filter(d => !d.isStarred && !d.isPinned);

    $mTbody.append(`<tr class="group-header g-monthly">
        <td colspan="4"><i class="fas fa-calendar-alt" style="margin-right:6px;"></i>${monthLabel}公告（共 ${monthlyItems.length} 則）</td>
    </tr>`);
    if (monthlyItems.length === 0) {
        $mTbody.append(`<tr><td colspan="4"><div class="empty-state"><i class="fas fa-inbox"></i><p>本月份尚無其他公告</p></div></td></tr>`);
    } else {
        monthlyItems.forEach(item => renderRow(item, '#monthly_tbody'));
    }
}

function renderRow(item, targetTbody) {
    const { id, title, imgPath, pdfPath, date, status, isStarred, isPinned, linkUrl } = item;
    const titleEsc = title.replace(/'/g, "\\'");

    let viewIcons = '<div class="view-icons">';
    if (imgPath) viewIcons += `<button class="view-icon-btn img" onclick="viewFile('${imgPath}','${titleEsc}')" title="查看圖片"><i class="fas fa-image"></i></button>`;
    if (pdfPath) viewIcons += `<button class="view-icon-btn pdf" onclick="viewFile('${pdfPath}','${titleEsc}')" title="查看PDF"><i class="fas fa-file-pdf"></i></button>`;
    if (linkUrl) viewIcons += `<a class="view-icon-btn link" href="${linkUrl}" target="_blank" title="前往相關連結" onclick="event.stopPropagation()"><i class="fas fa-link"></i></a>`;
    viewIcons += '</div>';

    const rowClass = isStarred ? 'row-pinned' : (isPinned ? 'row-pinned-only' : '');
    const rowClick = imgPath
        ? `viewFile('${imgPath}','${titleEsc}')`
        : (pdfPath ? `viewFile('${pdfPath}','${titleEsc}')` : (linkUrl ? `window.open('${linkUrl}','_blank')` : ''));

    const row = `<tr class="${rowClass}" onclick="${rowClick}" style="cursor:${rowClick?'pointer':'default'}">
        <td><span class="date-text">${date}</span></td>
        <td><span class="badge badge-${status}">${status}</span></td>
        <td><span class="title-text">${title}</span></td>
        <td onclick="event.stopPropagation()">${viewIcons}</td>
    </tr>`;

    $(targetTbody).append(row);
}

// ── VIEW FILE ──
function viewFile(path, caption) {
    if (!path) return;
    const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)(\?.*)?$/i.test(path);
    if (isImage) openLightbox(path, caption || '');
    else window.open(path, '_blank');
}

function openLightbox(src, caption) {
    const lb  = document.getElementById('lightbox');
    document.getElementById('lb_img').src = src;
    document.getElementById('lb_caption').textContent = caption || '';
    document.getElementById('lb_open_btn').href = src;
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
}
</script>
